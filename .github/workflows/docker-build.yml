name: 构建 Docker 镜像

# 运行日志与 artifact 仅保留 1 天，到期自动清理
retention-days: 1

on:
  push:
    branches: [master]
    paths:
      - 'docker/**'
      - 'scripts/dns-huaweicloud.js'
      - 'scripts/sync-dns.js'
      - 'scripts/sync-cname.js'
      - 'scripts/fetch-isp-ips.js'
      - 'scripts/check-dns.js'
      - 'workers/**/wrangler.toml'
      - 'package.json'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/city-gate-cron

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU（多架构支持）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: tags
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          echo "sha=ghcr.io/${{ github.repository_owner }}/city-gate-cron:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${{ github.repository_owner }}/city-gate-cron:latest" >> "$GITHUB_OUTPUT"

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.latest }}
            ${{ steps.tags.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
