name: 部署 Pages + SaaS + Firewall

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      accounts:
        description: '部署目标账户（1=账户1，2=账户2，1,2=两个账户，留空则全部）'
        required: false
        type: string
        default: '1,2'
  schedule:
    # 每周一 UTC 0:00 自动检查 SaaS/Firewall 配置一致性
    - cron: '0 0 * * 1'

# ── 多账户配置 ──────────────────────────────────────────
# 每个账户独立 job，避免 matrix + secrets 动态引用限制
# 新增账户只需：1) 添加 GitHub Secrets  2) 复制一份对应 job

jobs:
  # ================================================================
  #  Job 0：清理旧 Worker Routes（账户1）
  # ================================================================
  cleanup-routes-1:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 清理旧 Worker Routes（账户1）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_KEY: default
        run: node scripts/cleanup-worker-routes.js

  # ================================================================
  #  Job 0b：清理旧 Worker Routes（账户2）
  # ================================================================
  cleanup-routes-2:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    steps:
      - name: 检查是否部署账户2
        id: check
        run: |
          ACCOUNTS="${{ github.event.inputs.accounts || '1,2' }}"
          if echo "$ACCOUNTS" | grep -qw "2"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 检出代码
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v4
      - name: 设置 Node.js
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 清理旧 Worker Routes（账户2）
        if: steps.check.outputs.skip == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          CLOUDFLARE_API_TOKEN_2: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          TOKEN_KEY: account2
        run: node scripts/cleanup-worker-routes.js

  # ================================================================
  #  Job 1：SaaS 配置（账户1）
  # ================================================================
  setup-saas-1:
    needs: [cleanup-routes-1]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 配置 CF for SaaS（账户1）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_KEY: default
        run: node scripts/setup-saas.js

  # ================================================================
  #  Job 2：SaaS 配置（账户2）
  # ================================================================
  setup-saas-2:
    needs: [cleanup-routes-2]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    steps:
      - name: 检查是否部署账户2
        id: check
        run: |
          ACCOUNTS="${{ github.event.inputs.accounts || '1,2' }}"
          if echo "$ACCOUNTS" | grep -qw "2"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 检出代码
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v4
      - name: 设置 Node.js
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 配置 CF for SaaS（账户2）
        if: steps.check.outputs.skip == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          CLOUDFLARE_API_TOKEN_2: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          TOKEN_KEY: account2
        run: node scripts/setup-saas.js

  # ================================================================
  #  Job 3：Firewall 配置（账户1）
  # ================================================================
  setup-firewall-1:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 配置 WAF Custom Rules（账户1）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_KEY: default
        run: node scripts/setup-firewall.js

  # ================================================================
  #  Job 4：Firewall 配置（账户2）
  # ================================================================
  setup-firewall-2:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    steps:
      - name: 检查是否部署账户2
        id: check
        run: |
          ACCOUNTS="${{ github.event.inputs.accounts || '1,2' }}"
          if echo "$ACCOUNTS" | grep -qw "2"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 检出代码
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v4
      - name: 设置 Node.js
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 配置 WAF Custom Rules（账户2）
        if: steps.check.outputs.skip == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          CLOUDFLARE_API_TOKEN_2: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          TOKEN_KEY: account2
        run: node scripts/setup-firewall.js

  # ================================================================
  #  Job 5：部署 Pages（cxapk 下载页）— 账户1
  # ================================================================
  deploy-pages:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 安装依赖
        run: npm install --prefix $RUNNER_TEMP/obf javascript-obfuscator
      - name: 混淆 JS
        env:
          NODE_PATH: ${{ runner.temp }}/obf/node_modules
        run: node scripts/obfuscate-cxapk.js
      - name: 安装 wrangler
        run: npm install -g wrangler
      - name: 部署 cxapk Pages（账户1）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages project create cxapk --production-branch=master || true
          wrangler pages deploy pages/cxapk --project-name=cxapk --commit-dirty=true

  # ================================================================
  #  Job 6：部署 Pages（cxapk 下载页）— 账户2
  # ================================================================
  deploy-pages-2:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: 检查是否部署账户2
        id: check
        run: |
          ACCOUNTS="${{ github.event.inputs.accounts || '1,2' }}"
          if echo "$ACCOUNTS" | grep -qw "2"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "跳过账户2 Pages 部署"
          fi
      - name: 检出代码
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v4
      - name: 设置 Node.js
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 安装依赖
        if: steps.check.outputs.skip == 'false'
        run: npm install --prefix $RUNNER_TEMP/obf javascript-obfuscator
      - name: 混淆 JS
        if: steps.check.outputs.skip == 'false'
        env:
          NODE_PATH: ${{ runner.temp }}/obf/node_modules
        run: node scripts/obfuscate-cxapk.js
      - name: 安装 wrangler
        if: steps.check.outputs.skip == 'false'
        run: npm install -g wrangler
      - name: 部署 cxapk Pages（账户2）
        if: steps.check.outputs.skip == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_2 }}
        run: |
          wrangler pages project create cxapk --production-branch=master || true
          wrangler pages deploy pages/cxapk --project-name=cxapk --commit-dirty=true

  # ================================================================
  #  Job 7：部署汇总
  # ================================================================
  deploy-summary:
    runs-on: ubuntu-latest
    needs: [cleanup-routes-1, cleanup-routes-2, setup-saas-1, setup-saas-2, setup-firewall-1, setup-firewall-2, deploy-pages, deploy-pages-2]
    if: always()
    steps:
      - name: 部署结果汇总
        run: |
          echo "━━━ 部署结果汇总 ━━━"
          echo "账户1 Routes:   ${{ needs.cleanup-routes-1.result }}"
          echo "账户2 Routes:   ${{ needs.cleanup-routes-2.result }}"
          echo "账户1 SaaS:     ${{ needs.setup-saas-1.result }}"
          echo "账户2 SaaS:     ${{ needs.setup-saas-2.result }}"
          echo "账户1 Firewall: ${{ needs.setup-firewall-1.result }}"
          echo "账户2 Firewall: ${{ needs.setup-firewall-2.result }}"
          echo "账户1 Pages:    ${{ needs.deploy-pages.result }}"
          echo "账户2 Pages:    ${{ needs.deploy-pages-2.result }}"
          FAILED=false
          for r in "${{ needs.setup-saas-1.result }}" "${{ needs.setup-saas-2.result }}" "${{ needs.setup-firewall-1.result }}" "${{ needs.setup-firewall-2.result }}" "${{ needs.deploy-pages.result }}" "${{ needs.deploy-pages-2.result }}"; do
            if [ "$r" = "failure" ]; then
              FAILED=true
            fi
          done
          if [ "$FAILED" = "true" ]; then
            echo "⚠ 有部署失败"
            exit 1
          fi
          echo "✓ 全部部署完成"
