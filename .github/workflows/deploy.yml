name: 部署 Worker + DNS + Firewall + Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      accounts:
        description: '部署目标账户（1=账户1，2=账户2，1,2=两个账户，留空则全部）'
        required: false
        type: string
        default: '1,2'
  schedule:
    # 每周一 UTC 0:00 自动检查 DNS/Firewall 配置一致性
    - cron: '0 0 * * 1'

# ── 多账户配置 ──────────────────────────────────────────
# 每个账户独立 job，避免 matrix + secrets 动态引用限制

jobs:
  # ================================================================
  #  Job 0：部署 Worker（账户1）
  # ================================================================
  deploy-worker-1:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 解析 Pages 项目真实域名
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/resolve-pages.js
      - name: 生成 Worker Routes
        run: node scripts/generate-routes.js
      - name: 安装 wrangler
        run: npm install -g wrangler
      - name: 部署 Worker（账户1）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd workers/city-gate
          wrangler deploy -c wrangler.generated.toml

  # ================================================================
  #  Job 0b：部署 Worker（账户2）
  # ================================================================
  deploy-worker-2:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: 检查是否部署账户2
        id: check
        run: |
          ACCOUNTS="${{ github.event.inputs.accounts || '1,2' }}"
          if echo "$ACCOUNTS" | grep -qw "2"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 检出代码
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v4
      - name: 设置 Node.js
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 解析 Pages 项目真实域名
        if: steps.check.outputs.skip == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
        run: node scripts/resolve-pages.js
      - name: 生成 Worker Routes
        if: steps.check.outputs.skip == 'false'
        run: node scripts/generate-routes.js
      - name: 安装 wrangler
        if: steps.check.outputs.skip == 'false'
        run: npm install -g wrangler
      - name: 部署 Worker（账户2）
        if: steps.check.outputs.skip == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
        run: |
          cd workers/city-gate-2
          wrangler deploy -c wrangler.generated.toml

  # ================================================================
  #  Job 1：清理旧 SaaS 资源 + 配置 DNS（账户1）
  # ================================================================
  setup-dns-1:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 清理旧 SaaS 资源（账户1）
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_2: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          TOKEN_KEY: default
        run: node scripts/cleanup-saas.js
      - name: 配置 DNS A 记录 + 优选 IP（账户1）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_2: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          TOKEN_KEY: default
        run: node scripts/setup-saas.js

  # ================================================================
  #  Job 2：清理旧 SaaS 资源 + 配置 DNS（账户2）
  # ================================================================
  setup-dns-2:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    steps:
      - name: 检查是否部署账户2
        id: check
        run: |
          ACCOUNTS="${{ github.event.inputs.accounts || '1,2' }}"
          if echo "$ACCOUNTS" | grep -qw "2"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 检出代码
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v4
      - name: 设置 Node.js
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 清理旧 SaaS 资源（账户2）
        continue-on-error: true
        if: steps.check.outputs.skip == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_2: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          TOKEN_KEY: account2
        run: node scripts/cleanup-saas.js
      - name: 配置 DNS A 记录 + 优选 IP（账户2）
        if: steps.check.outputs.skip == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_2: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          TOKEN_KEY: account2
        run: node scripts/setup-saas.js

  # ================================================================
  #  Job 3：Firewall 配置（账户1）
  # ================================================================
  setup-firewall-1:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 配置 WAF Custom Rules（账户1）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_KEY: default
        run: node scripts/setup-firewall.js

  # ================================================================
  #  Job 4：Firewall 配置（账户2）
  # ================================================================
  setup-firewall-2:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    steps:
      - name: 检查是否部署账户2
        id: check
        run: |
          ACCOUNTS="${{ github.event.inputs.accounts || '1,2' }}"
          if echo "$ACCOUNTS" | grep -qw "2"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 检出代码
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v4
      - name: 设置 Node.js
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 配置 WAF Custom Rules（账户2）
        if: steps.check.outputs.skip == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          CLOUDFLARE_API_TOKEN_2: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          TOKEN_KEY: account2
        run: node scripts/setup-firewall.js

  # ================================================================
  #  Job 5：部署 Pages（cxapk 下载页）— 账户1
  # ================================================================
  deploy-pages:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 安装依赖
        run: npm install --prefix $RUNNER_TEMP/obf javascript-obfuscator
      - name: 混淆 JS
        env:
          NODE_PATH: ${{ runner.temp }}/obf/node_modules
        run: node scripts/obfuscate-cxapk.js
      - name: 安装 wrangler
        run: npm install -g wrangler
      - name: 部署 cxapk Pages（账户1）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages project create cxapk --production-branch=master || true
          wrangler pages deploy pages/cxapk --project-name=cxapk --commit-dirty=true

  # ================================================================
  #  Job 6：部署 Pages（cxapk 下载页）— 账户2
  # ================================================================
  deploy-pages-2:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: 检查是否部署账户2
        id: check
        run: |
          ACCOUNTS="${{ github.event.inputs.accounts || '1,2' }}"
          if echo "$ACCOUNTS" | grep -qw "2"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "跳过账户2 Pages 部署"
          fi
      - name: 检出代码
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v4
      - name: 设置 Node.js
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 安装依赖
        if: steps.check.outputs.skip == 'false'
        run: npm install --prefix $RUNNER_TEMP/obf javascript-obfuscator
      - name: 混淆 JS
        if: steps.check.outputs.skip == 'false'
        env:
          NODE_PATH: ${{ runner.temp }}/obf/node_modules
        run: node scripts/obfuscate-cxapk.js
      - name: 安装 wrangler
        if: steps.check.outputs.skip == 'false'
        run: npm install -g wrangler
      - name: 部署 cxapk Pages（账户2）
        if: steps.check.outputs.skip == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_2 }}
        run: |
          wrangler pages project create cxapk --production-branch=master || true
          wrangler pages deploy pages/cxapk --project-name=cxapk --commit-dirty=true

  # ================================================================
  #  Job 7：部署汇总
  # ================================================================
  deploy-summary:
    runs-on: ubuntu-latest
    needs: [deploy-worker-1, deploy-worker-2, setup-dns-1, setup-dns-2, setup-firewall-1, setup-firewall-2, deploy-pages, deploy-pages-2]
    if: always()
    steps:
      - name: 部署结果汇总
        run: |
          echo "━━━ 部署结果汇总 ━━━"
          echo "账户1 Worker:  ${{ needs.deploy-worker-1.result }}"
          echo "账户2 Worker:  ${{ needs.deploy-worker-2.result }}"
          echo "账户1 DNS:      ${{ needs.setup-dns-1.result }}"
          echo "账户2 DNS:      ${{ needs.setup-dns-2.result }}"
          echo "账户1 Firewall: ${{ needs.setup-firewall-1.result }}"
          echo "账户2 Firewall: ${{ needs.setup-firewall-2.result }}"
          echo "账户1 Pages:    ${{ needs.deploy-pages.result }}"
          echo "账户2 Pages:    ${{ needs.deploy-pages-2.result }}"
          FAILED=false
          for r in "${{ needs.deploy-worker-1.result }}" "${{ needs.deploy-worker-2.result }}" "${{ needs.setup-dns-1.result }}" "${{ needs.setup-dns-2.result }}" "${{ needs.setup-firewall-1.result }}" "${{ needs.setup-firewall-2.result }}" "${{ needs.deploy-pages.result }}" "${{ needs.deploy-pages-2.result }}"; do
            if [ "$r" = "failure" ]; then
              FAILED=true
            fi
          done
          if [ "$FAILED" = "true" ]; then
            echo "⚠ 有部署失败"
            exit 1
          fi
          echo "✓ 全部部署完成"
