name: 部署 Workers

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      worker:
        description: '指定部署的 Worker（留空则部署全部）'
        required: false
        type: string
      update_xdb:
        description: '更新 ip2region xdb（1=是，0=跳过）'
        required: false
        type: string
        default: '1'
  schedule:
    # 每周一 UTC 0:00 自动检查 v4/v6 xdb 更新
    - cron: '0 0 * * 1'

jobs:
  # ── Job 1：检查并更新 ip2region xdb ──────────────────
  update-xdb:
    runs-on: ubuntu-latest
    # 手动指定跳过时不执行；定时/推送时默认执行
    if: ${{ github.event.inputs.update_xdb != '0' || github.event_name == 'push' || github.event_name == 'schedule' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 更新 ip2region xdb 到 KV（自动创建 namespace）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_IP2REGION_NAMESPACE_ID }}
        run: node scripts/update-ip2region.js

  # ── Job 2：部署 Workers（仅 push 和手动触发时执行）────
  deploy:
    runs-on: ubuntu-latest
    needs: [update-xdb]
    # xdb 更新成功或被跳过时才部署；定时任务不需要部署
    if: >-
      ${{
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        (needs.update-xdb.result == 'success' || needs.update-xdb.result == 'skipped')
      }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 wrangler
        run: npm install -g wrangler

      - name: 注入 KV namespace ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 优先从 secret 获取
          KV_ID="${{ secrets.KV_IP2REGION_NAMESPACE_ID }}"

          # secret 未配置时，通过 Cloudflare API 查找已创建的 KV namespace
          if [ -z "$KV_ID" ]; then
            echo "通过 API 查找 KV namespace city-gate-IP2REGION..."
            RESPONSE=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces")
            KV_ID=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for ns in data.get('result', []):
              if ns.get('title') == 'city-gate-IP2REGION':
                  print(ns['id'])
                  break
          " 2>/dev/null || true)
          fi

          if [ -n "$KV_ID" ] && [ "$KV_ID" != "PLACEHOLDER_KV_IP2REGION_NAMESPACE_ID" ]; then
            # 注入到所有包含占位符的 wrangler.toml
            for toml in workers/*/wrangler.toml; do
              if grep -q "PLACEHOLDER_KV_IP2REGION_NAMESPACE_ID" "$toml"; then
                sed -i "s/PLACEHOLDER_KV_IP2REGION_NAMESPACE_ID/$KV_ID/g" "$toml"
                echo "已注入 KV namespace id 到 $toml: $KV_ID"
              fi
            done
          else
            echo "警告: 未找到 KV namespace id，Worker 可能无法正常工作"
          fi

      - name: 确定要部署的 Workers
        id: workers
        run: |
          if [ -n "${{ github.event.inputs.worker }}" ]; then
            WORKERS="${{ github.event.inputs.worker }}"
          else
            WORKERS=$(find workers -name "wrangler.toml" -exec dirname {} \; | sed 's|workers/||' | sort | tr '\n' ' ')
          fi
          echo "list=$WORKERS" >> "$GITHUB_OUTPUT"
          echo "将部署: $WORKERS"

      - name: 部署 Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for worker in ${{ steps.workers.outputs.list }}; do
            echo "部署 $worker ..."
            if (cd "workers/$worker" && wrangler deploy); then
              echo "✓ $worker 部署成功"
            else
              echo "✗ $worker 部署失败"
              exit 1
            fi
          done
