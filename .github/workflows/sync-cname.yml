name: 同步 DNS CNAME

on:
  # 每 6 小时自动检查同步（UTC 整点，北京时间 2:00/8:00/14:00/20:00）
  # 说明：CNAME 记录配置后长期不变，同步频率只影响"池域名失效后的自愈速度"，
  #       6 小时对 DNS 场景足够；每小时会占 GitHub Actions 免费额度一半以上（约 1000+ 分钟/月）。
  schedule:
    - cron: '0 */6 * * *'
  # 手动触发
  workflow_dispatch:
    inputs:
      dry_run:
        description: '预览模式（1=仅预览不执行）'
        required: false
        type: string
        default: '0'
  # 推送 master 时自动同步（可按需关闭）
  push:
    branches: [master]
    paths:
      - 'scripts/sync-cname.js'

jobs:
  sync-cname:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 同步 CNAME 记录
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_2: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: node scripts/sync-cname.js
