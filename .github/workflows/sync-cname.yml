name: 同步 DNS CNAME

on:
  # 定时任务已停用——DNS 同步改为国内 Docker 定时执行 sync-dns.js（A 记录模式）
  # 海外 CI 无法检测 Cloudflare 挑战页（仅国内网络环境触发），保留 workflow_dispatch 供手动触发
  # schedule:
  #   - cron: '0 */6 * * *'
  # 手动触发
  workflow_dispatch:
    inputs:
      dry_run:
        description: '预览模式（1=仅预览不执行）'
        required: false
        type: string
        default: '0'
  # 推送 master 时自动同步（可按需关闭）
  push:
    branches: [master]
    paths:
      - 'scripts/sync-cname.js'
      - 'workers/**/wrangler.toml'

jobs:
  sync-cname:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 同步 CNAME 记录
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_2: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: node scripts/sync-cname.js
