<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>应用下载</title>
<style>
  :root {
    --antd-primary: #1677FF;
    --antd-primary-bg: #E6F4FF;
    --antd-primary-border: #91CAFF;
    --antd-success: #00B42A;
    --antd-success-bg: #E8FFEA;
    --antd-success-border: #B9F0C5;
    --antd-warning: #FF7D00;
    --antd-bg-base: #F5F5F5;
    --antd-bg-card: #FFFFFF;
    --antd-text-primary: rgba(0,0,0,0.88);
    --antd-text-secondary: rgba(0,0,0,0.65);
    --antd-text-tertiary: rgba(0,0,0,0.45);
    --antd-border: #F0F0F0;
    --antd-radius: 8px;
    --antd-radius-lg: 12px;
    --antd-shadow: 0 1px 2px 0 rgba(0,0,0,0.03), 0 1px 6px -1px rgba(0,0,0,0.02), 0 2px 4px 0 rgba(0,0,0,0.02);
    --antd-shadow-md: 0 3px 6px -4px rgba(0,0,0,0.12), 0 6px 16px 0 rgba(0,0,0,0.08), 0 9px 28px 8px rgba(0,0,0,0.05);
  }
  @media(prefers-color-scheme:dark) {
    :root {
      --antd-primary: #4096FF;
      --antd-primary-bg: #111D2C;
      --antd-primary-border: #1D4160;
      --antd-success: #52C41A;
      --antd-success-bg: #1A3A24;
      --antd-success-border: #245730;
      --antd-warning: #FFA940;
      --antd-bg-base: #141414;
      --antd-bg-card: #1F1F1F;
      --antd-text-primary: rgba(255,255,255,0.88);
      --antd-text-secondary: rgba(255,255,255,0.65);
      --antd-text-tertiary: rgba(255,255,255,0.35);
      --antd-border: #303030;
      --antd-shadow: 0 1px 2px 0 rgba(0,0,0,0.2), 0 1px 6px -1px rgba(0,0,0,0.12), 0 2px 4px 0 rgba(0,0,0,0.08);
      --antd-shadow-md: 0 3px 6px -4px rgba(0,0,0,0.36), 0 6px 16px 0 rgba(0,0,0,0.24), 0 9px 28px 8px rgba(0,0,0,0.18);
    }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--antd-bg-base);color:var(--antd-text-primary);
    line-height:1.5714;padding:24px 0 48px;-webkit-font-smoothing:antialiased;
  }
  .section{max-width:560px;margin:0 auto 24px;padding:0 16px}
  .section:last-child{margin-bottom:0}
  .section-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .section-icon{
    width:32px;height:32px;border-radius:var(--antd-radius);
    display:flex;align-items:center;justify-content:center;
    font-size:17px;color:#fff;flex-shrink:0;
  }
  .section-icon--android{background:var(--antd-success)}
  .section-icon--ios{background:var(--antd-primary)}
  .section-head h2{font-size:18px;font-weight:600;color:var(--antd-text-primary)}
  .section-hint{font-size:13px;color:var(--antd-text-tertiary);margin-top:-10px;margin-bottom:14px;padding-left:42px}
  .app-card{
    background:var(--antd-bg-card);border:1px solid var(--antd-border);
    border-radius:var(--antd-radius-lg);padding:16px 20px;margin-bottom:10px;
    box-shadow:var(--antd-shadow);transition:box-shadow .2s,transform .2s;
  }
  .app-card:hover{box-shadow:var(--antd-shadow-md);transform:translateY(-1px)}
  .app-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .app-info{display:flex;align-items:center;gap:10px;min-width:0}
  .app-dot{width:8px;height:8px;border-radius:50%;background:var(--antd-success);flex-shrink:0}
  .app-dot--ios{background:var(--antd-primary)}
  .app-name{font-size:15px;font-weight:600;color:var(--antd-text-primary)}
  .app-action{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 16px;font-size:13px;font-weight:500;line-height:1;
    border-radius:var(--antd-radius);border:none;cursor:pointer;
    transition:all .2s;white-space:nowrap;
  }
  .app-action--android{
    background:var(--antd-success);color:#fff;
  }
  .app-action--android:hover{box-shadow:0 2px 8px rgba(0,180,42,0.35);transform:translateY(-1px)}
  .app-action--android:active{transform:scale(.97)}
  .app-action--ios{
    background:var(--antd-primary);color:#fff;
  }
  .app-action--ios:hover{box-shadow:0 2px 8px rgba(22,119,255,0.35);transform:translateY(-1px)}
  .app-action--ios:active{transform:scale(.97)}
  .app-action[disabled]{opacity:.5;cursor:not-allowed;transform:none!important;box-shadow:none!important}
  .section-icon--answer{background:var(--antd-warning)}
  .app-action--answer{background:var(--antd-warning);color:#fff}
  .app-action--answer:hover{box-shadow:0 2px 8px rgba(255,125,0,0.35);transform:translateY(-1px)}
  .app-action--answer:active{transform:scale(.97)}

  /* 节点切换器 */
  .node-switcher{margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .node-switcher-current{font-size:12px;color:var(--antd-text-secondary);line-height:1.5;white-space:nowrap}
  .node-switcher-current .node-current-label{color:var(--antd-text-tertiary)}
  .node-switcher-current .node-current-name{font-weight:600}
  .node-switcher-current .node-current-latency{font-size:11px;opacity:.7}
  .node-switcher-toggle{
    font-size:12px;color:var(--antd-text-tertiary);cursor:pointer;
    background:none;border:none;padding:0;line-height:1.5;
    transition:color .2s;
  }
  .node-switcher-toggle:hover{color:var(--antd-text-secondary)}
  .node-switcher-list{display:none;width:100%;margin-top:4px;gap:6px;flex-wrap:wrap}
  .node-switcher-list.open{display:flex}
  .node-item{
    display:inline-flex;align-items:center;gap:4px;
    padding:4px 10px;font-size:12px;font-weight:500;
    border-radius:var(--antd-radius);border:1px solid var(--antd-border);
    background:var(--antd-bg-card);color:var(--antd-text-secondary);
    cursor:pointer;transition:all .2s;white-space:nowrap;
  }
  .node-item:hover{border-color:var(--antd-primary-border);color:var(--antd-primary)}
  .node-item.active{
    border-color:var(--antd-primary);background:var(--antd-primary-bg);
    color:var(--antd-primary);font-weight:600;
  }
  .node-item.unreachable{opacity:.4;cursor:not-allowed}
  .node-item .node-latency{font-size:11px;opacity:.7;font-weight:400}

</style>
</head>
<body>

<div class="section">
  <div class="node-switcher">
    <span class="node-switcher-current" id="node-current"><span class="node-current-label">当前节点:</span> <span class="node-current-name">测速中…</span></span>
    <button class="node-switcher-toggle" id="node-toggle">切换节点 ▾</button>
    <div class="node-switcher-list" id="node-list"></div>
  </div>
</div>

<div class="section">
  <div class="section-head">
    <span class="section-icon section-icon--android">🤖</span>
    <h2>安卓下载</h2>
  </div>
  <p class="section-hint">点击直接下载 APK 安装包</p>
  <div id="android-list"></div>
</div>
<div class="section">
  <div class="section-head">
    <span class="section-icon section-icon--ios">🍎</span>
    <h2>iOS 添加到主屏幕</h2>
  </div>
  <p class="section-hint">Safari 打开 → 分享 → 添加到主屏幕</p>
  <div id="ios-list"></div>
</div>

<div class="section">
  <div class="section-head">
    <span class="section-icon section-icon--answer">💬</span>
    <h2>Answer 问答社区</h2>
  </div>
  <p class="section-hint">点击进入问答社区</p>
  <div class="app-card">
    <div class="app-row">
      <div class="app-info"><span class="app-dot" style="background:var(--antd-warning)"></span><span class="app-name">Answer</span></div>
      <button class="app-action app-action--answer" id="answer-btn" disabled>竞速中…</button>
    </div>
  </div>
</div>

<script>
var prefixes = ['sg', 'books', 'bible', 'cx'];
var names = { sg: '诗歌', books: '书籍', bible: '圣经', cx: '晨读' };
var suffixes = ['1189.dpdns.org', 'zhaozg.dpdns.org', 'bxg.dpdns.org', 'zzgxxx.eu.org', 'zhaozg.cloudns.org','xzdjx.dpdns.org'];

var CACHE_KEY = 'cx_fastest_suffix';
var CACHE_TTL = 3600000;

// 检测当前页面所在域名是否属于已知 suffix（通过 Worker 代理访问）
// 如果是，优先用当前 suffix，避免跨域
function detectCurrentSuffix() {
  var host = location.hostname;
  for (var i = 0; i < suffixes.length; i++) {
    if (host === 'apk.' + suffixes[i] || host === 'cxapk-ah0.pages.dev' || host.endsWith('.' + suffixes[i])) {
      return suffixes[i];
    }
  }
  return null;
}

function getCachedSuffix() {
  try {
    var cached = localStorage.getItem(CACHE_KEY);
    if (!cached) return null;
    var parsed = JSON.parse(cached);
    if (Date.now() - parsed.t < CACHE_TTL) return parsed.s;
    localStorage.removeItem(CACHE_KEY);
  } catch (e) {}
  return null;
}

function setCachedSuffix(suffix) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ s: suffix, t: Date.now() }));
  } catch (e) {}
}

function raceSuffix() {
  // 确定初始选中节点：当前域名 > 缓存
  var initialSuffix = detectCurrentSuffix() || getCachedSuffix() || null;

  // 每域名测 2 轮取最小值：
  //  - 单次测量易受网络抖动影响，最小值更接近真实延迟
  //  - 第 1 轮 DNS 未缓存的域名会偏慢，第 2 轮大家都热了，min 口径更公平
  var results = {};   // suffix -> 当前最小延迟（99999 = 不可达）

  // 单次探测：3 秒独立超时（AbortController），不拖累整页竞速
  function probeOnce(suffix, round) {
    var start = Date.now();
    var controller = ('AbortController' in window) ? new AbortController() : null;
    var opts = { method: 'HEAD', cache: 'no-store' };
    if (controller) {
      opts.signal = controller.signal;
      setTimeout(function() { controller.abort(); }, 3000);
    }
    return fetch('https://apk.' + suffix + '/?_t=' + start + '_' + round, opts)
      .then(function(r) {
        // 只有 2xx/3xx 才算真正可访问，5xx/4xx（含 1034 等）视为不可用
        if (r.status >= 200 && r.status < 400) {
          var t = Date.now() - start;
          // 取本轮与历史轮次的最小值
          if (results[suffix] === undefined || t < results[suffix]) { results[suffix] = t; }
        } else if (results[suffix] === undefined) {
          // 有历史成功样本时不覆盖为不可达；本轮失败只跳过
          results[suffix] = 99999;
        }
      })
      .catch(function() {
        if (results[suffix] === undefined) { results[suffix] = 99999; }
      });
  }

  // 轮内 6 域名并发，轮间串行（第 2 轮等第 1 轮结束再发起）：
  //  - 避免两轮叠乘成 12 个并发请求抢连接池/带宽
  //  - 第 2 轮发起时 DNS 已全部热过，min 口径才公平
  function probeRound(round) {
    return Promise.all(suffixes.map(function(suffix) {
      return probeOnce(suffix, round);
    }));
  }

  var allRounds = probeRound(1).then(function() { return probeRound(2); });

  // 8 秒超时兜底（2 轮串行 + 单请求 3s 独立超时），防止所有域名不可达时等太久
  var timeout = new Promise(function(resolve) {
    setTimeout(function() { resolve(null); }, 8000);
  });

  return Promise.race([allRounds, timeout]).then(function() {
    // 选最快节点
    var best = suffixes[0];
    var bestTime = 99999;
    suffixes.forEach(function(s) {
      var t = results[s];
      if (t !== undefined && t < bestTime) { bestTime = t; best = s; }
    });
    // 始终选竞速最快的节点
    var suffix = best;
    var latency = (results[suffix] != null && results[suffix] < 99999) ? results[suffix] : null;
    setCachedSuffix(suffix);
    return { suffix: suffix, latency: latency, results: results };
  });
}

function renderAppList() {
  var androidContainer = document.getElementById('android-list');
  var iosContainer = document.getElementById('ios-list');

  prefixes.forEach(function(prefix) {
    var name = names[prefix];

    // Android card
    var androidCard = document.createElement('div');
    androidCard.className = 'app-card';
    androidCard.innerHTML =
      '<div class="app-row">' +
        '<div class="app-info"><span class="app-dot"></span><span class="app-name">' + name + '</span></div>' +
        '<button class="app-action app-action--android" data-prefix="' + prefix + '" disabled>竞速中…</button>' +
      '</div>';
    androidContainer.appendChild(androidCard);

    // iOS card
    var iosCard = document.createElement('div');
    iosCard.className = 'app-card';
    iosCard.innerHTML =
      '<div class="app-row">' +
        '<div class="app-info"><span class="app-dot app-dot--ios"></span><span class="app-name">' + name + '</span></div>' +
        '<button class="app-action app-action--ios" data-prefix="' + prefix + '" disabled>竞速中…</button>' +
      '</div>';
    iosContainer.appendChild(iosCard);
  });
}

function downloadApk(prefix, suffix) {
  var btn = document.querySelector('.app-action--android[data-prefix="' + prefix + '"]');
  if (btn) { btn.disabled = true; btn.textContent = '获取中…'; }

  fetch('https://' + prefix + '.' + suffix + '/version.json', { cache: 'no-store' })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && data.apk_file) {
        location.href = 'https://' + prefix + '.' + suffix + '/' + data.apk_file;
      } else {
        alert('未找到 APK 信息');
      }
    })
    .catch(function() {
      alert('获取版本信息失败，请稍后重试');
    })
    .finally(function() {
      if (btn) { btn.disabled = false; btn.textContent = '下载 APK'; }
    });
}

function openPwa(prefix, suffix) {
  location.href = 'https://' + prefix + '.' + suffix;
}

function bindButtons(suffix) {
  document.querySelectorAll('.app-action--android').forEach(function(btn) {
    var newBtn = btn.cloneNode(true);
    btn.parentNode.replaceChild(newBtn, btn);
    newBtn.addEventListener('click', function() {
      downloadApk(newBtn.getAttribute('data-prefix'), suffix);
    });
  });
  document.querySelectorAll('.app-action--ios').forEach(function(btn) {
    var newBtn = btn.cloneNode(true);
    btn.parentNode.replaceChild(newBtn, btn);
    newBtn.addEventListener('click', function() {
      openPwa(newBtn.getAttribute('data-prefix'), suffix);
    });
  });
  // Answer button
  var answerBtn = document.getElementById('answer-btn');
  if (answerBtn) {
    var newAnswerBtn = answerBtn.cloneNode(true);
    answerBtn.parentNode.replaceChild(newAnswerBtn, answerBtn);
    newAnswerBtn.addEventListener('click', function() {
      location.href = 'https://answer.' + suffix;
    });
  }
}

function init() {
  renderAppList();
  raceSuffix().then(function(result) {
    var suffix = result.suffix;
    var latency = result.latency;
    var raceResults = result.results || {};
    window._lastRaceResults = raceResults;
    // 竞速完成后启用按钮并绑定事件
    document.querySelectorAll('.app-action--android').forEach(function(btn) {
      btn.disabled = false;
      btn.textContent = '下载 APK';
    });
    document.querySelectorAll('.app-action--ios').forEach(function(btn) {
      btn.disabled = false;
      btn.textContent = '打开 PWA';
    });
    var answerBtn = document.getElementById('answer-btn');
    if (answerBtn) {
      answerBtn.disabled = false;
      answerBtn.textContent = '打开 Answer';
    }
    bindButtons(suffix);
    // 更新当前节点显示
    updateNodeCurrent(suffix, latency);
    // Render node switcher
    renderNodeSwitcher(suffix, raceResults);
  });
}

function renderNodeSwitcher(activeSuffix, raceResults) {
  var toggle = document.getElementById('node-toggle');
  var list = document.getElementById('node-list');
  if (!toggle || !list) return;

  // 排序：可达节点按延迟升序，不可达排末尾
  var sorted = suffixes.slice().sort(function(a, b) {
    var ta = raceResults[a] != null ? raceResults[a] : 99999;
    var tb = raceResults[b] != null ? raceResults[b] : 99999;
    return ta - tb;
  });

  sorted.forEach(function(suffix) {
    var t = raceResults[suffix];
    var unreachable = (t == null || t >= 99999);
    var el = document.createElement('span');
    el.className = 'node-item' + (suffix === activeSuffix ? ' active' : '') + (unreachable ? ' unreachable' : '');
    el.setAttribute('data-suffix', suffix);
    var label = suffix;
    if (!unreachable) {
      el.innerHTML = label + ' <span class="node-latency">' + t + 'ms</span>';
    } else {
      el.innerHTML = label + ' <span class="node-latency">不可达</span>';
    }
    if (!unreachable) {
      el.addEventListener('click', function() {
        switchNode(suffix);
      });
    }
    list.appendChild(el);
  });

  toggle.addEventListener('click', function() {
    list.classList.toggle('open');
    toggle.textContent = list.classList.contains('open') ? '切换节点 ▴' : '切换节点 ▾';
  });
}

function updateNodeCurrent(suffix, latency) {
  var el = document.getElementById('node-current');
  if (!el) return;
  var latencyText = (latency !== null && latency !== undefined && latency < 99999) ? ' <span class="node-current-latency">' + latency + 'ms</span>' : '';
  el.innerHTML = '<span class="node-current-label">当前节点:</span> <span class="node-current-name">' + suffix + '</span>' + latencyText;
}

function switchNode(suffix) {
  setCachedSuffix(suffix);
  // 更新按钮绑定
  bindButtons(suffix);
  // 更新 active 样式（用 data 属性精确匹配，避免前缀歧义）
  document.querySelectorAll('.node-item').forEach(function(el) {
    el.classList.toggle('active', el.getAttribute('data-suffix') === suffix);
  });
  // 更新当前节点显示
  var latency = (window._lastRaceResults && window._lastRaceResults[suffix] != null && window._lastRaceResults[suffix] < 99999) ? window._lastRaceResults[suffix] : null;
  updateNodeCurrent(suffix, latency);
}

init();
</script>
</body>
</html>
