<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>应用下载</title>
<style>
  :root {
    --antd-primary: #1677FF;
    --antd-primary-bg: #E6F4FF;
    --antd-primary-border: #91CAFF;
    --antd-success: #00B42A;
    --antd-success-bg: #E8FFEA;
    --antd-success-border: #B9F0C5;
    --antd-warning: #FF7D00;
    --antd-bg-base: #F5F5F5;
    --antd-bg-card: #FFFFFF;
    --antd-text-primary: rgba(0,0,0,0.88);
    --antd-text-secondary: rgba(0,0,0,0.65);
    --antd-text-tertiary: rgba(0,0,0,0.45);
    --antd-border: #F0F0F0;
    --antd-radius: 8px;
    --antd-radius-lg: 12px;
    --antd-shadow: 0 1px 2px 0 rgba(0,0,0,0.03), 0 1px 6px -1px rgba(0,0,0,0.02), 0 2px 4px 0 rgba(0,0,0,0.02);
    --antd-shadow-md: 0 3px 6px -4px rgba(0,0,0,0.12), 0 6px 16px 0 rgba(0,0,0,0.08), 0 9px 28px 8px rgba(0,0,0,0.05);
  }
  @media(prefers-color-scheme:dark) {
    :root {
      --antd-primary: #4096FF;
      --antd-primary-bg: #111D2C;
      --antd-primary-border: #1D4160;
      --antd-success: #52C41A;
      --antd-success-bg: #1A3A24;
      --antd-success-border: #245730;
      --antd-warning: #FFA940;
      --antd-bg-base: #141414;
      --antd-bg-card: #1F1F1F;
      --antd-text-primary: rgba(255,255,255,0.88);
      --antd-text-secondary: rgba(255,255,255,0.65);
      --antd-text-tertiary: rgba(255,255,255,0.35);
      --antd-border: #303030;
      --antd-shadow: 0 1px 2px 0 rgba(0,0,0,0.2), 0 1px 6px -1px rgba(0,0,0,0.12), 0 2px 4px 0 rgba(0,0,0,0.08);
      --antd-shadow-md: 0 3px 6px -4px rgba(0,0,0,0.36), 0 6px 16px 0 rgba(0,0,0,0.24), 0 9px 28px 8px rgba(0,0,0,0.18);
    }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--antd-bg-base);color:var(--antd-text-primary);
    line-height:1.5714;padding:24px 0 48px;-webkit-font-smoothing:antialiased;
  }
  .section{max-width:560px;margin:0 auto;padding:0 16px}
  .section-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .section-icon{
    width:32px;height:32px;border-radius:var(--antd-radius);
    display:flex;align-items:center;justify-content:center;
    font-size:17px;color:#fff;flex-shrink:0;
  }
  .section-icon--android{background:var(--antd-success)}
  .section-icon--ios{background:var(--antd-primary)}
  .section-head h2{font-size:18px;font-weight:600;color:var(--antd-text-primary)}
  .section-hint{font-size:13px;color:var(--antd-text-tertiary);margin-top:-10px;margin-bottom:14px;padding-left:42px}
  .app-card{
    background:var(--antd-bg-card);border:1px solid var(--antd-border);
    border-radius:var(--antd-radius-lg);padding:16px 20px;margin-bottom:10px;
    box-shadow:var(--antd-shadow);transition:box-shadow .2s,transform .2s;
  }
  .app-card:hover{box-shadow:var(--antd-shadow-md);transform:translateY(-1px)}
  .app-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .app-info{display:flex;align-items:center;gap:10px;min-width:0}
  .app-dot{width:8px;height:8px;border-radius:50%;background:var(--antd-success);flex-shrink:0}
  .app-dot--ios{background:var(--antd-primary)}
  .app-name{font-size:15px;font-weight:600;color:var(--antd-text-primary)}
  .app-action{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 16px;font-size:13px;font-weight:500;line-height:1;
    border-radius:var(--antd-radius);border:none;cursor:pointer;
    transition:all .2s;white-space:nowrap;
  }
  .app-action--android{
    background:var(--antd-success);color:#fff;
  }
  .app-action--android:hover{box-shadow:0 2px 8px rgba(0,180,42,0.35);transform:translateY(-1px)}
  .app-action--android:active{transform:scale(.97)}
  .app-action--ios{
    background:var(--antd-primary);color:#fff;
  }
  .app-action--ios:hover{box-shadow:0 2px 8px rgba(22,119,255,0.35);transform:translateY(-1px)}
  .app-action--ios:active{transform:scale(.97)}
  .app-action[disabled]{opacity:.5;cursor:not-allowed;transform:none!important;box-shadow:none!important}

</style>
</head>
<body>

<div class="section">
  <div class="section-head">
    <span class="section-icon section-icon--android">🤖</span>
    <h2>安卓下载</h2>
  </div>
  <p class="section-hint">点击直接下载 APK 安装包</p>
  <div id="android-list"></div>
</div>
<div class="section">
  <div class="section-head">
    <span class="section-icon section-icon--ios">🍎</span>
    <h2>iOS 添加到主屏幕</h2>
  </div>
  <p class="section-hint">Safari 打开 → 分享 → 添加到主屏幕</p>
  <div id="ios-list"></div>
</div>

<script>
var prefixes = ['sg', 'books', 'bible', 'cx'];
var names = { sg: '诗歌', books: '书籍', bible: '圣经', cx: '晨兴' };
var suffixes = ['1189.dpdns.org', 'zhaozg.dpdns.org', '1189.de5.net', 'zhaozg.de5.net', 'zzg.cc.cd', '1189.kdns.fr'];

var CACHE_KEY = 'cx_fastest_suffix';
var CACHE_TTL = 3600000;

// 检测当前页面所在域名是否属于已知 suffix（通过 Worker 代理访问）
// 如果是，优先用当前 suffix，避免跨域
function detectCurrentSuffix() {
  var host = location.hostname;
  for (var i = 0; i < suffixes.length; i++) {
    if (host === 'apk.' + suffixes[i] || host === 'cxapk-ah0.pages.dev' || host.endsWith('.' + suffixes[i])) {
      return suffixes[i];
    }
  }
  return null;
}

function getCachedSuffix() {
  try {
    var cached = localStorage.getItem(CACHE_KEY);
    if (!cached) return null;
    var parsed = JSON.parse(cached);
    if (Date.now() - parsed.t < CACHE_TTL) return parsed.s;
    localStorage.removeItem(CACHE_KEY);
  } catch (e) {}
  return null;
}

function setCachedSuffix(suffix) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ s: suffix, t: Date.now() }));
  } catch (e) {}
}

function raceSuffix() {
  // 如果当前已在已知 suffix 域名下，直接用当前 suffix，无需竞速
  var current = detectCurrentSuffix();
  if (current) {
    setCachedSuffix(current);
    return Promise.resolve(current);
  }

  var cached = getCachedSuffix();
  if (cached) return Promise.resolve(cached);

  var results = {};
  var promises = suffixes.map(function(suffix) {
    var start = Date.now();
    return fetch('https://' + suffix + '/?ping', { method: 'HEAD', mode: 'no-cors', cache: 'no-store' })
      .then(function() {
        results[suffix] = Date.now() - start;
      })
      .catch(function() {
        results[suffix] = 99999;
      });
  });

  // 10 秒超时兜底，防止所有域名不可达时等太久
  var timeout = new Promise(function(resolve) {
    setTimeout(function() { resolve(null); }, 10000);
  });

  return Promise.race([Promise.all(promises), timeout]).then(function() {
    var best = suffixes[0];
    var bestTime = 99999;
    suffixes.forEach(function(s) {
      var t = results[s];
      if (t !== undefined && t < bestTime) { bestTime = t; best = s; }
    });
    setCachedSuffix(best);
    return best;
  });
}

function renderAppList() {
  var androidContainer = document.getElementById('android-list');
  var iosContainer = document.getElementById('ios-list');

  prefixes.forEach(function(prefix) {
    var name = names[prefix];

    // Android card
    var androidCard = document.createElement('div');
    androidCard.className = 'app-card';
    androidCard.innerHTML =
      '<div class="app-row">' +
        '<div class="app-info"><span class="app-dot"></span><span class="app-name">' + name + '</span></div>' +
        '<button class="app-action app-action--android" data-prefix="' + prefix + '" disabled>竞速中…</button>' +
      '</div>';
    androidContainer.appendChild(androidCard);

    // iOS card
    var iosCard = document.createElement('div');
    iosCard.className = 'app-card';
    iosCard.innerHTML =
      '<div class="app-row">' +
        '<div class="app-info"><span class="app-dot app-dot--ios"></span><span class="app-name">' + name + '</span></div>' +
        '<button class="app-action app-action--ios" data-prefix="' + prefix + '" disabled>竞速中…</button>' +
      '</div>';
    iosContainer.appendChild(iosCard);
  });
}

function downloadApk(prefix, suffix) {
  var btn = document.querySelector('.app-action--android[data-prefix="' + prefix + '"]');
  if (btn) { btn.disabled = true; btn.textContent = '获取中…'; }

  fetch('https://' + prefix + '.' + suffix + '/version.json', { cache: 'no-store' })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && data.apk_file) {
        location.href = 'https://' + prefix + '.' + suffix + '/' + data.apk_file;
      } else {
        alert('未找到 APK 信息');
      }
    })
    .catch(function() {
      alert('获取版本信息失败，请稍后重试');
    })
    .finally(function() {
      if (btn) { btn.disabled = false; btn.textContent = '下载 APK'; }
    });
}

function openPwa(prefix, suffix) {
  location.href = 'https://' + prefix + '.' + suffix;
}

function bindButtons(suffix) {
  document.querySelectorAll('.app-action--android').forEach(function(btn) {
    btn.addEventListener('click', function() {
      downloadApk(btn.getAttribute('data-prefix'), suffix);
    });
  });
  document.querySelectorAll('.app-action--ios').forEach(function(btn) {
    btn.addEventListener('click', function() {
      openPwa(btn.getAttribute('data-prefix'), suffix);
    });
  });
}

function init() {
  renderAppList();
  raceSuffix().then(function(suffix) {
    // 竞速完成后启用按钮并绑定事件
    document.querySelectorAll('.app-action--android').forEach(function(btn) {
      btn.disabled = false;
      btn.textContent = '下载 APK';
    });
    document.querySelectorAll('.app-action--ios').forEach(function(btn) {
      btn.disabled = false;
      btn.textContent = '打开 PWA';
    });
    bindButtons(suffix);
    // Show fastest suffix
    var hint = document.querySelector('.section-hint');
    if (hint) hint.textContent += '  |  当前节点: ' + suffix;
  });
}

init();
</script>
</body>
</html>
