name = "city-gate-2"
main = "worker.js"
compatibility_date = "2024-12-01"

# ── 账户2 Worker — 冗余容灾实例 ──────────────────────
# 与 city-gate 共享同一份 worker.js 代码
# 域名使用 zhaozg.de5.net Zone，Pages 源站使用账户2的 Pages 项目

# ── 域名配置（唯一配置来源）───────────────────────────
# Worker 透明传输模式：自定义域名 → Pages (*.pages.dev) / 外部源站
[vars]
DOMAIN_CONFIG_JSON = """
{
  "zones": ["zhaozg.de5.net"],
  "groups": [
    {
      "prefix": "sg",
      "pages_project": "sg"
    },
    {
      "prefix": "books",
      "pages_project": "books"
    },
    {
      "prefix": "bible",
      "pages_project": "bible"
    },
    {
      "prefix": "cx",
      "pages_project": "cx",
      "pages_domain": "cx-1wd.pages.dev"
    },
    {
      "prefix": "sg-resource",
      "pages_project": "sg-resource"
    },
    {
      "prefix": "apk",
      "pages_project": "cxapk"
    }
  ]
}
"""
