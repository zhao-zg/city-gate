name = "city-gate-2"
main = "worker.js"
compatibility_date = "2024-12-01"

# ── 账户2 Worker — 冗余容灾实例 ──────────────────────
# 与 city-gate 共享同一份 worker.js 代码（通过相对路径引用 ../shared/）
# 域名使用 zhaozg.de5.net Zone，Pages 源站使用账户2的 Pages 项目
# KV 绑定账户2自己的 IP2REGION namespace

# ── KV 绑定 ──────────────────────────────────────────
# 账户2独立的 KV namespace，部署时 CI 会自动注入 id
[[kv_namespaces]]
binding = "IP2REGION"
id = "PLACEHOLDER_KV_IP2REGION_NAMESPACE_ID"

# ── 域名配置（唯一配置来源）───────────────────────────
# zones 数组元素支持两种写法：
#   "zhaozg.de5.net"                                  → 使用优选域名（默认）
#   { "name": "zhaozg.de5.net", "noPreferred": true } → 不使用优选域名，
#     同步脚本（sync-cname.js）会将该 zone 的子域名直接 CNAME 到
#     各前缀对应的源站 origin，不分配优选域名池
[vars]
DOMAIN_CONFIG_JSON = """
{
  "zones": ["zhaozg.de5.net"],
  "groups": [
    {
      "prefix": "sg",
      "origin": "https://sg-7gj.pages.dev",
      "cities": ["ALL"]
    },
    {
      "prefix": "books",
      "origin": "https://books-89r.pages.dev",
      "cities": ["ALL"],
      "schedule": {
        "days": [1, 2, 3, 4, 5, 6, 7],
        "periods": ["01:00-22:00"]
      }
    },
    {
      "prefix": "bible",
      "origin": "https://bible-2o8.pages.dev",
      "cities": ["杭州", "Hangzhou"],
      "provinces": ["浙江", "Zhejiang"]
    },
    {
      "prefix": "cx",
      "origin": "https://cx-1wd.pages.dev",
      "cities": ["ALL"]
    },
    {
      "prefix": "sg-resource",
      "origin": "https://sg-resource.pages.dev",
      "cities": ["ALL"]
    },
    {
      "prefix": "apk",
      "origin": "https://cxapk-ah0.pages.dev",
      "cities": ["ALL"]
    }
  ]
}
"""
