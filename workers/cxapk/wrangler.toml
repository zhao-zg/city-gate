name = "cxapk"
main = "worker.js"
compatibility_date = "2024-12-01"

# ── KV 绑定 ──────────────────────────────────────────
# 存放 ip2region xdb 数据文件（与 city-gate 共享同一 namespace）
# 部署时 CI 会自动注入 id
[[kv_namespaces]]
binding = "IP2REGION"
id = "PLACEHOLDER_KV_IP2REGION_NAMESPACE_ID"

# 路由配置
[[routes]]
pattern = "apk.07170501.xyz/*"
zone_name = "07170501.xyz"

[[routes]]
pattern = "apk.zhaozg.dpdns.org/*"
zone_name = "zhaozg.dpdns.org"

# 城市/省份限制（不配置则全部允许）
# IPv4 走 ip2region 城市级匹配，IPv6 降级到 CF 省级匹配
#[vars]
#ALLOWED_CITIES = "杭州,Hangzhou"
#ALLOWED_PROVINCES = "浙江,Zhejiang"
