name = "city-gate"
main = "worker.js"
compatibility_date = "2024-12-01"

# ── KV 绑定 ──────────────────────────────────────────
# 存放 ip2region xdb 数据文件
# 部署时 update-ip2region.js 脚本会自动查找/创建 KV namespace
# 并将 id 写回此文件；CI 部署步骤也会自动注入 id
[[kv_namespaces]]
binding = "IP2REGION"
id = "PLACEHOLDER_KV_IP2REGION_NAMESPACE_ID"

# 路由配置 — 每个域名绑定到此 Worker，城市规则在下方 DOMAIN_CONFIG_JSON 中按域名配置
[[routes]]
pattern = "sg.1189.dpdns.org/*"
zone_name = "1189.dpdns.org"

[[routes]]
pattern = "sg.07170501.xyz/*"
zone_name = "07170501.xyz"

[[routes]]
pattern = "sg.bxg.dpdns.org/*"
zone_name = "bxg.dpdns.org"

[[routes]]
pattern = "sg.zhaozg.dpdns.org/*"
zone_name = "zhaozg.dpdns.org"

[[routes]]
pattern = "sg.zhaozg.cloudns.org/*"
zone_name = "zhaozg.cloudns.org"

[[routes]]
pattern = "books.07170501.xyz/*"
zone_name = "07170501.xyz"

[[routes]]
pattern = "books.1189.dpdns.org/*"
zone_name = "1189.dpdns.org"

[[routes]]
pattern = "books.zhaozg.dpdns.org/*"
zone_name = "zhaozg.dpdns.org"

[[routes]]
pattern = "bible.zhaozg.dpdns.org/*"
zone_name = "zhaozg.dpdns.org"

[[routes]]
pattern = "bible.1189.dpdns.org/*"
zone_name = "1189.dpdns.org"

[[routes]]
pattern = "bible.07170501.xyz/*"
zone_name = "07170501.xyz"

[[routes]]
pattern = "cx.zhaozg.dpdns.org/*"
zone_name = "zhaozg.dpdns.org"

[[routes]]
pattern = "sg-resource.zhaozg.dpdns.org/*"
zone_name = "zhaozg.dpdns.org"


# 环境变量 — DOMAIN_CONFIG_JSON 为唯一配置来源（域名组数组，worker.js 运行时展开为域名映射）
# GATE_KEY 通过 wrangler secret 设置（与 cxapk Worker 共享同一密钥）
[vars]
DOMAIN_CONFIG_JSON = """
[
  {
    "origin": "https://sg-7gj.pages.dev",
    "cities": ["杭州", "Hangzhou"],
    "provinces": ["浙江", "Zhejiang"],
    "domains": [
      "sg.1189.dpdns.org",
      "sg.07170501.xyz",
      "sg.bxg.dpdns.org",
      "sg.zhaozg.dpdns.org",
      "sg.zhaozg.cloudns.org"
    ]
  },
  {
    "origin": "https://books-89r.pages.dev",
    "cities": ["杭州", "Hangzhou"],
    "provinces": ["浙江", "Zhejiang"],
    "domains": [
      "books.07170501.xyz",
      "books.1189.dpdns.org",
      "books.zhaozg.dpdns.org"
    ]
  },
  {
    "origin": "https://bible-2o8.pages.dev",
    "cities": ["杭州", "Hangzhou"],
    "provinces": ["浙江", "Zhejiang"],
    "domains": [
      "bible.zhaozg.dpdns.org",
      "bible.07170501.xyz",
      "bible.1189.dpdns.org"
    ]
  },
  {
    "origin": "https://cx-1wd.pages.dev",
    "cities": ["ALL"],
    "domains": [
      "cx.zhaozg.dpdns.org"
    ]
  },
  {
    "origin": "https://sg-resource.pages.dev",
    "cities": ["ALL"],
    "domains": [
      "sg-resource.zhaozg.dpdns.org"
    ]
  }
]
"""
