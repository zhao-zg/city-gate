name = "city-gate"
main = "worker.js"
compatibility_date = "2024-12-01"

# 路由配置 — 每个域名绑定到此 Worker，城市规则在 worker.js 的 DOMAIN_CONFIG 中按域名配置
[[routes]]
pattern = "sg.1189.dpdns.org/*"
zone_name = "1189.dpdns.org"

[[routes]]
pattern = "sg.07170501.xyz/*"
zone_name = "07170501.xyz"

[[routes]]
pattern = "sg.bxg.dpdns.org/*"
zone_name = "bxg.dpdns.org"

[[routes]]
pattern = "sg.zhaozg.dpdns.org/*"
zone_name = "zhaozg.dpdns.org"

[[routes]]
pattern = "sg.zhaozg.cloudns.org/*"
zone_name = "zhaozg.cloudns.org"

# 环境变量（可选，DOMAIN_CONFIG_JSON 可覆盖代码内配置）
# [vars]
# DOMAIN_CONFIG_JSON = '{"sg.example.com":{"cities":["Beijing","Shanghai"],"origin":"https://sg.pages.dev"}}'
