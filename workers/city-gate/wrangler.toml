name = "city-gate"
main = "worker.js"
compatibility_date = "2024-12-01"

# ── KV 绑定 ──────────────────────────────────────────
# 存放 ip2region xdb 数据文件
# 部署时 update-ip2region.js 脚本会自动查找/创建 KV namespace
# 并将 id 写回此文件；CI 部署步骤也会自动注入 id
#      "provinces": ["浙江", "Zhejiang"]
[[kv_namespaces]]
binding = "IP2REGION"
id = "PLACEHOLDER_KV_IP2REGION_NAMESPACE_ID"

# ── 域名配置（唯一配置来源）───────────────────────────
# zones 数组元素支持两种写法：
#   "zzg.cc.cd"                                      → 使用优选域名（默认）
#   { "name": "zzg.cc.cd", "noPreferred": true }  → 不使用优选域名，
#     同步脚本（sync-cname.js）会将该 zone 的子域名直接 CNAME 到
#     各前缀对应的源站 origin，不分配优选域名池
#      "cities": ["杭州", "Hangzhou"],
#      "provinces": ["浙江", "Zhejiang"],
# 不优选域名{ "name": "zhaozg.dpdns.org", "noPreferred": true },
[vars]
DOMAIN_CONFIG_JSON = """
{
  "zones": [
    "1189.dpdns.org",
    "zhaozg.dpdns.org",
    "1189.de5.net",
    "zzg.cc.cd",
    "1189.kdns.fr"
  ],
  "groups": [
    {
      "prefix": "sg",
      "pages_project": "sg",
      "cities": ["ALL"]
    },
    {
      "prefix": "books",
      "pages_project": "books",
      "cities": ["ALL"],
      "schedule": {
        "days": [1, 2, 3, 4, 5, 6, 7],
        "periods": ["01:00-22:00"]
      }
    },
    {
      "prefix": "bible",
      "pages_project": "bible",
      "cities": ["ALL"]
    },
    {
      "prefix": "cx",
      "pages_project": "cx",
      "cities": ["ALL"]
    },
    {
      "prefix": "sg-resource",
      "pages_project": "sg-resource",
      "cities": ["ALL"]
    },
    {
      "prefix": "apk",
      "pages_project": "cxapk",
      "cities": ["ALL"]
    },
    {
      "prefix": "answer",
      "origin": "https://answer.07170501.xyz",
      "cities": ["ALL"]
    }
  ]
}
"""
