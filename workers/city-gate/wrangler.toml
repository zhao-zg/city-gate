name = "city-gate"
main = "worker.js"
compatibility_date = "2024-12-01"

# ── KV 绑定 ──────────────────────────────────────────
# 存放 ip2region xdb 数据文件
# 部署时 update-ip2region.js 脚本会自动查找/创建 KV namespace
# 并将 id 写回此文件；CI 部署步骤也会自动注入 id
[[kv_namespaces]]
binding = "IP2REGION"
id = "PLACEHOLDER_KV_IP2REGION_NAMESPACE_ID"

[vars]
DOMAIN_CONFIG_JSON = """
{
  "zones": ["1189.dpdns.org", "zhaozg.dpdns.org", "1189.de5.net", "zzg.cc.cd", "1189.kdns.fr"],
  "groups": [
    {
      "prefix": "sg",
      "origin": "https://sg-f3b.pages.dev",
      "cities": ["ALL"]
    },
    {
      "prefix": "books",
      "origin": "https://books-em3.pages.dev",
      "cities": ["ALL"],
      "schedule": {
        "days": [1, 2, 3, 4, 5, 6, 7],
        "periods": ["01:00-22:00"]
      }
    },
    {
      "prefix": "bible",
      "origin": "https://bible-bka.pages.dev",
      "cities": ["ALL"]
#      "provinces": ["浙江", "Zhejiang"]
    },
    {
      "prefix": "cx",
      "origin": "https://cx-7ai.pages.dev",
      "cities": ["ALL"]
    },
    {
      "prefix": "sg-resource",
      "origin": "https://sg-resource-3ld.pages.dev",
      "cities": ["ALL"]
    },
    {
      "prefix": "apk",
      "origin": "https://cxapk-ah0.pages.dev",
      "cities": ["ALL"]
    }
  ]
}
"""
