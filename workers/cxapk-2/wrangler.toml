name = "cxapk-2"
main = "worker.js"
compatibility_date = "2024-12-01"

# ── 账户2 APK 代理 Worker — 冗余容灾实例 ──────────────
# 与 cxapk 共享同一份 worker.js 代码
# 域名使用 zhaozg.de5.net Zone
# KV 绑定账户2自己的 IP2REGION namespace

# ── KV 绑定 ──────────────────────────────────────────
# 与 city-gate-2 共享同一 KV namespace
[[kv_namespaces]]
binding = "IP2REGION"
id = "PLACEHOLDER_KV_IP2REGION_NAMESPACE_ID"

# 路由配置（无 DOMAIN_CONFIG_JSON，手动维护）
[[routes]]
pattern = "apk.zhaozg.de5.net/*"
zone_name = "zhaozg.de5.net"
