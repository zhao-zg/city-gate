name = "hangzhou-gate"
main = "worker.js"
compatibility_date = "2024-12-01"

# 路由配置 — 域名必须已托管在 Cloudflare
[[routes]]
pattern = "sg.1189.dpdns.org/*"
zone_name = "1189.dpdns.org"

[[routes]]
pattern = "sg.07170501.xyz/*"
zone_name = "07170501.xyz"

[[routes]]
pattern = "sg.bxg.dpdns.org/*"
zone_name = "bxg.dpdns.org"

# 环境变量
[vars]
ALLOWED_CITIES = "Hangzhou"
PAGES_ORIGIN = "https://sg.pages.dev"
