services:
  city-gate-cron:
    # 使用 GitHub Actions 自动构建并推送到 GHCR 的镜像
    # 多架构支持：linux/amd64 + linux/arm64
    image: ghcr.io/zhao-zg/city-gate-cron:latest
    container_name: city-gate-cron
    restart: unless-stopped
    environment:
      # ── 必填：Cloudflare API Token ──
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      # ── 可选：账户2 Token（多账户场景） ──
      - CLOUDFLARE_API_TOKEN_2=${CLOUDFLARE_API_TOKEN_2:-}
      # ── 可选：账户3 Token（多账户场景） ──
      - CLOUDFLARE_API_TOKEN_3=${CLOUDFLARE_API_TOKEN_3:-}
      # ── 定时计划（cron 表达式，默认每 6 小时） ──
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 */6 * * *}
      # ── 运行模式: sync（同步 DNS + 检验 + 测速） / check（仅检测） ──
      - RUN_MODE=${RUN_MODE:-sync}
      # ── 预览模式: 1=仅预览不执行修改 / 0=正常执行 ──
      - DRY_RUN=${DRY_RUN:-0}
      # ── 时区 ──
      - TZ=${TZ:-Asia/Shanghai}
      # ── Push 通知（可选，需配置通知 URL） ──
      - NOTIFY_URL=${NOTIFY_URL:-}
      - NOTIFY_TOKEN=${NOTIFY_TOKEN:-}
      # ── A 记录配置 ──
      - IP_PER_ZONE=${IP_PER_ZONE:-2}
      - IP_DEDUP_PREFIX=${IP_DEDUP_PREFIX:-32}
      # ── 测速配置 ──
      - MIN_SPEED_KBPS=${MIN_SPEED_KBPS:-500}
      - SPEED_TEST_SEC=${SPEED_TEST_SEC:-2}
      - MAX_LATENCY_MS=${MAX_LATENCY_MS:-300}
      # ── 测速模式：fast=达标即停 / best=全部测完选最优 / off=跳过测速 ──
      - SPEED_TEST_MODE=${SPEED_TEST_MODE:-fast}
      - MAX_SPEED_TEST_COUNT=${MAX_SPEED_TEST_COUNT:-20}
      # ── 测速域名（留空=自动检测，需为已部署 Worker 的域名） ──
      - SPEED_TEST_HOST=${SPEED_TEST_HOST:-}
      # ── 数据中心过滤（逗号分隔，如 HKG,LAX；留空=不过滤） ──
      - COLO_FILTER=${COLO_FILTER:-}
      # ── 延迟采样次数（默认 3，1=单次不取平均） ──
      - LATENCY_SAMPLES=${LATENCY_SAMPLES:-10}
      # ── 丢包率上限，超过则过滤（默认 0.1 = 10%） ──
      - MAX_PACKET_LOSS_RATE=${MAX_PACKET_LOSS_RATE:-0.1}
      # ── IP 来源：domain/cidr/both/自定义（默认 domain） ──
      - IP_SOURCE=${IP_SOURCE:-domain}
      # ── 每个 CIDR 最多采样 IP 数（默认 100） ──
      - CIDR_SAMPLES=${CIDR_SAMPLES:-100}
      # ── Zone 配置覆盖（可选，JSON 字符串，留空则使用镜像内 wrangler.toml） ──
      - ZONE_CONFIG_JSON=${ZONE_CONFIG_JSON:-}
      # ── cfIpTop20 补充开关（默认关闭，设为 1 开启） ──
      - ENABLE_CF_TOP20=${ENABLE_CF_TOP20:-}
      # ── 华为云 DNS（可选，zone 配置 dnsProvider=huaweicloud 时需要） ──
      # 认证方式：AK/SK 签名（SDK-HMAC-SHA256）
      - HUAWEICLOUD_DNS_AK=${HUAWEICLOUD_DNS_AK:-}
      - HUAWEICLOUD_DNS_SK=${HUAWEICLOUD_DNS_SK:-}
      - HUAWEICLOUD_DNS_ENDPOINT=${HUAWEICLOUD_DNS_ENDPOINT:-https://dns.myhuaweicloud.com}
      # ── 三网优选 IP 源（华为云分线路解析用） ──
      - ISP_IP_SOURCE=${ISP_IP_SOURCE:-cf.090227.xyz}
      - ISP_IP_PER_LINE=${ISP_IP_PER_LINE:-2}
    volumes:
      # 持久化日志
      - ./logs:/var/log/city-gate
