<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CX 应用下载</title>
<style>
  :root {
    --antd-primary: #1677FF;
    --antd-primary-bg: #E6F4FF;
    --antd-primary-border: #91CAFF;
    --antd-success: #00B42A;
    --antd-success-bg: #E8FFEA;
    --antd-success-border: #B9F0C5;
    --antd-warning: #FF7D00;
    --antd-bg-base: #F5F5F5;
    --antd-bg-card: #FFFFFF;
    --antd-text-primary: rgba(0,0,0,0.88);
    --antd-text-secondary: rgba(0,0,0,0.65);
    --antd-text-tertiary: rgba(0,0,0,0.45);
    --antd-border: #F0F0F0;
    --antd-radius: 8px;
    --antd-radius-lg: 12px;
    --antd-shadow: 0 1px 2px 0 rgba(0,0,0,0.03), 0 1px 6px -1px rgba(0,0,0,0.02), 0 2px 4px 0 rgba(0,0,0,0.02);
    --antd-shadow-md: 0 3px 6px -4px rgba(0,0,0,0.12), 0 6px 16px 0 rgba(0,0,0,0.08), 0 9px 28px 8px rgba(0,0,0,0.05);
  }
  @media(prefers-color-scheme:dark) {
    :root {
      --antd-primary: #4096FF;
      --antd-primary-bg: #111D2C;
      --antd-primary-border: #1D4160;
      --antd-success: #52C41A;
      --antd-success-bg: #1A3A24;
      --antd-success-border: #245730;
      --antd-warning: #FFA940;
      --antd-bg-base: #141414;
      --antd-bg-card: #1F1F1F;
      --antd-text-primary: rgba(255,255,255,0.88);
      --antd-text-secondary: rgba(255,255,255,0.65);
      --antd-text-tertiary: rgba(255,255,255,0.35);
      --antd-border: #303030;
      --antd-shadow: 0 1px 2px 0 rgba(0,0,0,0.2), 0 1px 6px -1px rgba(0,0,0,0.12), 0 2px 4px 0 rgba(0,0,0,0.08);
      --antd-shadow-md: 0 3px 6px -4px rgba(0,0,0,0.36), 0 6px 16px 0 rgba(0,0,0,0.24), 0 9px 28px 8px rgba(0,0,0,0.18);
    }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--antd-bg-base);color:var(--antd-text-primary);
    line-height:1.5714;padding:0 0 48px;-webkit-font-smoothing:antialiased;
  }
  .hero{
    text-align:center;padding:48px 20px 36px;
    background:linear-gradient(135deg,var(--antd-primary) 0%,#4096FF 100%);
    color:#fff;position:relative;overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 30% 120%,rgba(255,255,255,0.12) 0%,transparent 60%);
    pointer-events:none;
  }
  .hero-title{font-size:28px;font-weight:600;letter-spacing:.3px;margin-bottom:4px;position:relative}
  .hero-sub{font-size:14px;opacity:.8;position:relative}
  .section{max-width:560px;margin:24px auto 0;padding:0 16px}
  .section-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .section-icon{
    width:32px;height:32px;border-radius:var(--antd-radius);
    display:flex;align-items:center;justify-content:center;
    font-size:17px;color:#fff;flex-shrink:0;
  }
  .section-icon--android{background:var(--antd-success)}
  .section-icon--ios{background:var(--antd-primary)}
  .section-head h2{font-size:18px;font-weight:600;color:var(--antd-text-primary)}
  .section-hint{font-size:13px;color:var(--antd-text-tertiary);margin-top:-10px;margin-bottom:14px;padding-left:42px}
  .app-card{
    background:var(--antd-bg-card);border:1px solid var(--antd-border);
    border-radius:var(--antd-radius-lg);padding:16px 20px;margin-bottom:10px;
    box-shadow:var(--antd-shadow);transition:box-shadow .2s,transform .2s;
  }
  .app-card:hover{box-shadow:var(--antd-shadow-md);transform:translateY(-1px)}
  .app-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .app-info{display:flex;align-items:center;gap:10px;min-width:0}
  .app-dot{width:8px;height:8px;border-radius:50%;background:var(--antd-success);flex-shrink:0}
  .app-dot--ios{background:var(--antd-primary)}
  .app-name{font-size:15px;font-weight:600;color:var(--antd-text-primary)}
  .app-action{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 16px;font-size:13px;font-weight:500;line-height:1;
    border-radius:var(--antd-radius);border:none;cursor:pointer;
    transition:all .2s;white-space:nowrap;
  }
  .app-action--android{
    background:var(--antd-success);color:#fff;
  }
  .app-action--android:hover{box-shadow:0 2px 8px rgba(0,180,42,0.35);transform:translateY(-1px)}
  .app-action--android:active{transform:scale(.97)}
  .app-action--ios{
    background:var(--antd-primary);color:#fff;
  }
  .app-action--ios:hover{box-shadow:0 2px 8px rgba(22,119,255,0.35);transform:translateY(-1px)}
  .app-action--ios:active{transform:scale(.97)}
  .app-action--testing{
    background:var(--antd-text-tertiary);color:#fff;cursor:wait;
  }
  .app-speed{font-size:11px;color:var(--antd-text-tertiary);margin-top:4px}
  .footer{text-align:center;margin-top:32px;font-size:12px;color:var(--antd-text-tertiary);padding:0 16px}
</style>
</head>
<body>
<div class="hero">
  <h1 class="hero-title">CX 应用下载</h1>
  <p class="hero-sub">自动选择最快节点 · 一键下载</p>
</div>
<div class="section">
  <div class="section-head">
    <span class="section-icon section-icon--android">🤖</span>
    <h2>安卓下载</h2>
  </div>
  <p class="section-hint">点击直接下载 APK 安装包</p>
  <div id="android-list"></div>
</div>
<div class="section">
  <div class="section-head">
    <span class="section-icon section-icon--ios">🍎</span>
    <h2>iOS 添加到主屏幕</h2>
  </div>
  <p class="section-hint">Safari 打开 → 分享 → 添加到主屏幕</p>
  <div id="ios-list"></div>
</div>
<div class="footer">CX Download Portal · Powered by Cloudflare Workers</div>
<script>
(function(){
  const CFG = {"prefixes":["sg","books","bible","cx"],"suffixes":["1189.dpdns.org","zhaozg.dpdns.org","1189.de5.net","zzg.cc.cd","1189.kdns.fr"],"names":{"sg":"诗歌","books":"书籍","bible":"圣经","cx":"晨读"}};
  const CACHE_KEY = 'cx_fastest_suffix';
  const CACHE_TTL = 3600000;

  function getCached(){
    try{
      const r = localStorage.getItem(CACHE_KEY);
      if(!r) return null;
      const d = JSON.parse(r);
      if(Date.now() - d.t < CACHE_TTL) return d.s;
      localStorage.removeItem(CACHE_KEY);
    }catch(e){}
    return null;
  }
  function setCached(suffix){
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({s:suffix,t:Date.now()})); }catch(e){}
  }

  async function raceSuffixes(){
    const cached = getCached();
    if(cached) return cached;
    const ctrl = new AbortController();
    const timeout = setTimeout(()=>ctrl.abort(), 5000);
    const suffix = await Promise.any(CFG.suffixes.map(async s => {
      const url = 'https://apk.' + s + '/cx';
      const start = performance.now();
      await fetch(url, {method:'HEAD',mode:'no-cors',signal:ctrl.signal});
      const ms = Math.round(performance.now() - start);
      clearTimeout(timeout);
      return {suffix:s, ms};
    })).catch(()=>null);
    if(suffix){
      setCached(suffix.suffix);
      return suffix.suffix;
    }
    return CFG.suffixes[0];
  }

  function renderList(containerId, platform){
    const container = document.getElementById(containerId);
    container.innerHTML = CFG.prefixes.map(app => {
      const cls = platform === 'android' ? '' : ' app-dot--ios';
      const actionCls = platform === 'android' ? 'app-action--android' : 'app-action--ios';
      const label = platform === 'android' ? '下载' : '打开';
      return '<div class="app-card"><div class="app-row">' +
        '<div class="app-info"><span class="app-dot' + cls + '"></span><span class="app-name">' + CFG.names[app] + '</span></div>' +
        '<button class="app-action ' + actionCls + '" data-app="' + app + '" data-platform="' + platform + '">' +
        '<span class="btn-label">' + label + '</span></button>' +
        '</div><div class="app-speed" data-app="' + app + '" data-platform="' + platform + '"></div></div>';
    }).join('');
  }

  function bindButtons(fastestSuffix){
    document.querySelectorAll('.app-action').forEach(btn => {
      const app = btn.dataset.app;
      const platform = btn.dataset.platform;
      if(platform === 'android'){
        btn.onclick = ()=>{ location.href = 'https://apk.' + fastestSuffix + '/' + app; };
      } else {
        btn.onclick = ()=>{ location.href = 'https://' + app + '.' + fastestSuffix; };
      }
    });
  }

  async function init(){
    renderList('android-list', 'android');
    renderList('ios-list', 'ios');
    let fastest = getCached() || CFG.suffixes[0];
    bindButtons(fastest);
    const raced = await raceSuffixes();
    if(raced !== fastest){
      fastest = raced;
      bindButtons(fastest);
    }
  }
  init();
})();
</script>
</body>
</html>
